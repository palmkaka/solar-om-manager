# Supabase Local Dev Config
# https://supabase.com/docs/guides/cli/config

[api]
port = 54321

[db]
port = 54322
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://localhost:3000/auth/callback"
]

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false  # true ใน Production
